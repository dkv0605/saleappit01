<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
</head>
</html>
<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">KHACVIET WEB</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Trang chu</a>
                </li>
                {% for c in categories %}
                <li class="nav-item">
                    <a class="nav-link" href="/?category_id={{c.id}}">{{c.name}}</a>
                </li>
                {% endfor %}
                <li class="nav-item ">
                    <a class="nav-link text-danger" href="/login">Dang nhap</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-success" href="/register">Dang ki</a>
                </li>
            </ul>
            <form method="get" action="/" class="d-flex">
                <input class="form-control me-2" type="text" placeholder="Tim san pham..." name="kw">
                <button class="btn btn-primary" type="submit">Tim</button>
            </form>
        </div>
    </div>
</nav>


<section class="container mt-4">
    {% if products %}
    <div class="row">
        {% for p in products %}
        <div class="col-md-3 col-50% p-2">
            <div class="card">
                <img class="card-img-top" src="{{p.image}}" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title">{{p.name}}</h4>
                    <p class="card-text">{{p.price}} vnd</p>
                    <button href="#" class="btn btn-primary">Xem chi tiet</button>
                    <button href="#" class="btn btn-danger">Dat hang</button>
                </div>
            </div>
        </div>
        {% endfor %}
        {%else%}
        <div class="alert alert-warning mt-3">Khong co san pham nao</div>
        {% endif %}

    </div>
</section>

<footer>
    <div class="mt-5 p-3 bg-primary text-white rounded">
        <h1>KHACVIET WEB</h1>
        <p>&copy; khacviet</p>
    </div>
</footer>

</body>
</html>
