<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
</head>
<body>
<section class="container mt-4">
    <h1 class="text text-center text-info mt-3">LOGIN USER</h1>
    <form method="post">
        <div class="form-floating mb-3 mt-3"><input type="text" class="form-control" id="username"
                                                    placeholder="Ten dang nhap" name="username">
            <label for="username">Ten dang nhap</label>
        </div>
        <div class="form-floating mb-3 mt-3"><input type="password" class="form-control" id="password"
                                                    placeholder="Mat khau" name="password">
            <label for="password">Mat khau</label>
        </div>
        <div class="form-floating mb-3 mt-3">
            <button class="btn btn-success">Dang nhap</button>

        </div>
    </form>
</section>

</body>
</html>
